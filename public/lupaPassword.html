<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petik</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="font.css">
</head>
<body>
    <div class="container">
        <div class="judulLogin" id="judulLogin">
            <img src="petik.png" alt="logo">
            <h1 class="bungee-regular">ETIK</h1>
        </div>
        <div class="AunthContainer" id="AuthContainer">
            <div class="form-container">
                <h2>Lupa Password</h2>
                <p class="form-desc">Masukkan email yang terdaftar, kami akan mengirimkan link untuk mengatur ulang password kamu.</p>
                <div id="forgotMessage"></div>
                <form id="forgotForm">
                    <div class="input-group-login">
                        <label for="forgotEmail">Email</label>
                        <input type="email" id="forgotEmail" required>
                    </div>
                    <button type="submit" id="forgotBtn">Kirim Link Reset</button>
                </form>
                <div class="switch-form">
                    Ingat password kamu? <a href="index.html">Login di sini</a>
                </div>
            </div>
        </div>
    </div>

    <script src="lupaPassword.js"></script>
</body>
</html>
