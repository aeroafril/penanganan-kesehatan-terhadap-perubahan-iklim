<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petik</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="font.css">
</head>
<body>
    <div class="container">
        <div class="AunthContainer" id="AuthContainer">
            <div class="form-container" id="checkingState">
                <h2>Memeriksa Link...</h2>
                <p class="form-desc">Mohon tunggu sebentar.</p>
            </div>
            <div class="form-container hidden" id="invalidState">
                <h2>Link Tidak Valid</h2>
                <div id="invalidMessage"></div>
                <p class="form-desc">Link reset password sudah kedaluwarsa atau tidak valid. Silakan ajukan permintaan baru.</p>
                <a href="lupaPassword.html" class="switch-form-btn">Ajukan Ulang</a>
            </div>
            <div class="form-container hidden" id="resetState">
                <h2>Buat Password Baru</h2>
                <div id="resetMessage"></div>
                <form id="resetForm">
                    <div class="input-group-login">
                        <label for="newPassword">Password Baru</label>
                        <div class="password-wrapper">
                            <input type="password" id="newPassword" minlength="8" required>
                            <img src="eye.png" alt="Tampilkan password" class="toggle-password" data-target="newPassword">
                        </div>
                    </div>
                    <div class="input-group-login">
                        <label for="confirmNewPassword">Konfirmasi Password Baru</label>
                        <div class="password-wrapper">
                            <input type="password" id="confirmNewPassword" minlength="8" required>
                            <img src="eye.png" alt="Tampilkan password" class="toggle-password" data-target="confirmNewPassword">
                        </div>
                    </div>
                    <button type="submit" id="resetBtn">Simpan Password Baru</button>
                </form>
                <div class="switch-form">
                    <a href="index.html">Kembali ke Login</a>
                </div>
            </div>

        </div>
    </div>

    <script src="gantiPassword.js"></script>
</body>
</html>
